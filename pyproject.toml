[project]
name = "minigrid-meter-monitor"
version = "0.1.0"
description = "Smart-meter data pipeline for community solar mini-grids: cleaning, rule-based anomaly detection and revenue accounting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.44.7",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
